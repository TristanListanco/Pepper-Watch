name: Static Analysis

# SwiftLint over every target, with findings shown inline on pull requests. The project-specific
# checks (SF Symbols, assets, privacy strings, entitlements) run as the StaticAnalysisTests
# Swift Testing suite in the Tests workflow, which also fails on any compiler warning.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  XCODE_VERSION: "27.0"
  SWIFTLINT_VERSION: "0.65.1"
  SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select --switch "/Applications/Xcode_$XCODE_VERSION.app"
          xcodebuild -version

      - name: Install SwiftLint
        run: |
          # A pinned, checksum-verified release, so new rules never change results unannounced.
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/swiftlint.zip" swiftlint -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Lint
        run: |
          swiftlint version
          swiftlint lint --strict --reporter github-actions-logging
