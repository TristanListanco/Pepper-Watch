name: Tests

# Runs the Swift Testing suites for the iPhone app and the watch app on every pull request and
# every push to main. Simulator builds sign to run locally, so no Apple account is needed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The release the app is developed with; the runner also carries newer betas.
  XCODE_VERSION: "27.0"

jobs:
  test:
    name: ${{ matrix.name }}
    # The apps target iOS 27 and watchOS 27, which need Xcode 27.
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            scheme: Pepper Watch
            runtime: iOS-27
            device: iPhone
          - name: watchOS
            scheme: PepperWatchWatchApp
            runtime: watchOS-27
            device: Apple Watch

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select --switch "/Applications/Xcode_$XCODE_VERSION.app"
          xcodebuild -version

      - name: Pick a simulator
        id: simulator
        run: |
          # The newest matching runtime's first device, so the job doesn't depend on exact model names.
          udid=$(xcrun simctl list devices available --json | jq -r --arg runtime "$RUNTIME" --arg device "$DEVICE" '
            .devices | to_entries
            | map(select(.key | contains("SimRuntime." + $runtime)) | select(.value | length > 0))
            | sort_by(.key) | last | .value
            | map(select(.name | startswith($device))) | first | .udid // empty')
          if [ -z "$udid" ]; then
            echo "::error::No $DEVICE simulator with a $RUNTIME runtime"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices | grep "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
        env:
          RUNTIME: ${{ matrix.runtime }}
          DEVICE: ${{ matrix.device }}

      - name: Test
        run: |
          # Every target builds without warnings, so any new compiler warning fails the job.
          set -o pipefail
          xcodebuild test \
            -project "Pepper Watch.xcodeproj" \
            -scheme "$SCHEME" \
            -destination "id=$UDID" \
            -resultBundlePath TestResults.xcresult \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
        env:
          SCHEME: ${{ matrix.scheme }}
          UDID: ${{ steps.simulator.outputs.udid }}

      - name: Summarize results
        if: always() && hashFiles('TestResults.xcresult/**') != ''
        run: |
          xcrun xcresulttool get test-results summary --path TestResults.xcresult --compact > summary.json
          jq -r --arg name "${{ matrix.name }}" '
            "### \($name) tests: \(.result)\n\n| Passed | Failed | Skipped | Total |\n| --- | --- | --- | --- |\n| \(.passedTests) | \(.failedTests) | \(.skippedTests) | \(.totalTestCount) |"
          ' summary.json >> "$GITHUB_STEP_SUMMARY"
          jq -r '.testFailures[]? | "- **\(.testName)**: \(.failureText)"' summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result bundle
        if: failure() && hashFiles('TestResults.xcresult/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ matrix.name }}
          path: TestResults.xcresult
          retention-days: 7
